name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  # Nothing is released unless the tagged commit passes the same checks as CI.
  # Lint is skipped: it reports only changed lines, which were linted when they
  # merged.
  verify:
    uses: ./.github/workflows/checks.yml
    with:
      lint: false

  # Creates the GitHub release the other two jobs publish into, and resolves
  # the metadata every artifact of this release carries.
  release-notes:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      build_time: ${{ steps.meta.outputs.build_time }}
      go_version: ${{ steps.meta.outputs.go_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # BUILD_TIME is resolved once so the binaries and the images agree; the
      # format is the one script/ldflags.sh accepts.
      - name: Resolve release metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == *beta* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "go_version=$(go env GOVERSION | sed 's/^go//')" >> "$GITHUB_OUTPUT"

      # GoReleaser only writes the changelog and creates the release
      # (.goreleaser.yaml skips builds); releases-matrix uploads the binaries.
      - name: Install GoReleaser
        run: go install "github.com/goreleaser/goreleaser/v2@$(make -s print-GORELEASER_VERSION)"

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          goreleaser check
          goreleaser release --clean

  # Runs after release-notes so the images are only published once the GitHub
  # release exists, and in parallel with releases-matrix, which does not depend
  # on the images.
  build-docker:
    runs-on: ubuntu-latest
    needs: release-notes
    env:
      IMAGE_NAME: ppanel-server
      VERSION: ${{ needs.release-notes.outputs.version }}
      BUILD_TIME: ${{ needs.release-notes.outputs.build_time }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1.16.0 -> 1.16, so operators can follow a minor series. Only the
      # stable step uses it: on a prerelease tag this would yield a value
      # like 1.16.0-beta, which is why the beta step leaves it out.
      - name: Resolve image tags
        run: |
          echo "MAJOR_MINOR=${VERSION%.*}" >> $GITHUB_ENV
          echo "GIT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      # A tag fires this workflow no matter which line it sits on, so the floating
      # tag has to be routed: :latest must keep pointing at the feature line even
      # while the frozen LTS line publishes patches of its own. A commit reachable
      # from master belongs to LTS; anything else is the feature line. Treating an
      # ambiguous commit as LTS is the safe direction, since it leaves :latest be.
      - name: Resolve release line
        run: |
          git fetch --quiet origin master
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "FLOATING_TAG=lts" >> $GITHUB_ENV
          else
            echo "FLOATING_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image for main release
        if: "!contains(github.ref_name, 'beta')"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            CHANNEL=stable
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.FLOATING_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.MAJOR_MINOR }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ env.GIT_SHA }}

      - name: Build and push Docker image for beta release
        if: contains(github.ref_name, 'beta')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            CHANNEL=beta
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:beta
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ env.GIT_SHA }}

  releases-matrix:
    name: Release ppanel-server binary
    runs-on: ubuntu-latest
    needs: release-notes  # wait for release-notes job to finish
    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, linux/arm64,
        # windows/386, windows/amd64, windows/arm64, darwin/amd64, darwin/arm64
        goos: [ linux, windows, darwin ]
        goarch: [ '386', amd64, arm64 ]
        exclude:
          - goarch: '386'
            goos: darwin

    steps:
      - uses: actions/checkout@v4

      # script/ldflags.sh is the one definition of the injected metadata; make
      # and the Dockerfile call it too.
      - name: Resolve ldflags
        env:
          VERSION: ${{ needs.release-notes.outputs.version }}
          CHANNEL: ${{ needs.release-notes.outputs.channel }}
          BUILD_TIME: ${{ needs.release-notes.outputs.build_time }}
        # A separate assignment, so a rejected value fails the step instead of
        # building without metadata.
        run: |
          ldflags=$(sh script/ldflags.sh)
          echo "LDFLAGS=$ldflags" >> "$GITHUB_ENV"

      - uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          asset_name: "ppanel-server-${{ matrix.goos }}-${{ matrix.goarch }}"
          # The toolchain go.mod declares, the one the checks ran with.
          goversion: "https://dl.google.com/go/go${{ needs.release-notes.outputs.go_version }}.linux-amd64.tar.gz"
          project_path: "."
          binary_name: "ppanel-server"
          extra_files: LICENSE etc
          build_flags: -trimpath
          ldflags: ${{ env.LDFLAGS }}
