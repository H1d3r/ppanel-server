name: Nightly

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ppanel-server

jobs:
  # Nothing is published unless these pass. ci.yml deliberately skips pushes to
  # dev so the checks run once per push instead of twice.
  verify:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  publish:
    name: Publish nightly
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve build metadata
        run: |
          echo "VERSION=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date --iso-8601=seconds)" >> $GITHUB_ENV

      - name: Build binaries
        run: make linux-amd64 linux-arm64 VERSION=${{ env.VERSION }} CHANNEL=nightly

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # amd64 only: an arm64 leg would run under QEMU on every push to dev.
      - name: Build and push the nightly image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            CHANNEL=nightly
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:nightly
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:nightly-${{ env.VERSION }}

      # Replacing the release keeps one rolling entry whose asset URLs never
      # change, so releases/download/nightly/<name> always resolves to the newest
      # build. The tag is nightly rather than v-prefixed so it cannot trigger the
      # stable pipeline, which fires on 'v*'.
      - name: Publish the rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly ${{ env.VERSION }}" \
            --notes "Untested-in-production build from \`dev\` at \`${{ env.VERSION }}\`, built ${{ env.BUILD_TIME }}.

          Container image: \`ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:nightly-${{ env.VERSION }}\` (linux/amd64).

          Nightly builds apply database migrations automatically at boot, and a migration published here may still be renumbered before it reaches a stable release. Downgrading is not supported once a migration has run: the only rollback is restoring a database backup. Do not point this at production data." \
            bin/${{ env.IMAGE_NAME }}-linux-amd64 \
            bin/${{ env.IMAGE_NAME }}-linux-arm64
